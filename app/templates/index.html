<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Jobs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container">
        <span class="navbar-brand fw-bold">Campus Jobs</span>
        <button class="btn btn-light btn-sm" id="goApplications">Мои отклики</button>
      </div>
    </nav>

    <main class="container pb-4">
      <section id="alertBox" class="mb-3"></section>

      <section id="vacancyListView">
        <h1 class="h3 mb-3">Актуальные вакансии и стажировки</h1>
        <div id="vacancyCards" class="row g-3"></div>
      </section>

      <section id="vacancyDetailsView" class="d-none"></section>

      <section id="applicationsView" class="d-none">
        <h2 class="h4 mb-3">Мои отклики</h2>
        <form id="applicationsFilterForm" class="row g-2 mb-3">
          <div class="col-12 col-md-6">
            <input type="email" id="filterEmail" class="form-control" placeholder="Введите ваш email" required />
          </div>
          <div class="col-12 col-md-3">
            <button class="btn btn-primary w-100" type="submit">Показать</button>
          </div>
          <div class="col-12 col-md-3">
            <button id="goHome" class="btn btn-outline-secondary w-100" type="button">На главную</button>
          </div>
        </form>
        <div id="applicationsList" class="list-group"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
